[package]
name = "crushr-wasm-pack-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
blake3 = "1"
zstd = "0.13"
crushr-format = { path = "../../crates/crushr-format" }

[workspace]
