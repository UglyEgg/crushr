[package]
name = "crushr-wasm-readonly-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
crushr-core = { path = "../../crates/crushr-core" }
crushr-format = { path = "../../crates/crushr-format" }
blake3 = "1"
zstd = "0.13"
serde-wasm-bindgen = "0.6"

[workspace]
